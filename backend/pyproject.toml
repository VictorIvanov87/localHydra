[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localhydra"
version = "0.1.0"
description = "Observable, local-only model routing with Ollama (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# httpx is here only for FastAPI's TestClient; the runtime Ollama client is added by LH-002.
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[project.scripts]
localhydra = "localhydra.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
